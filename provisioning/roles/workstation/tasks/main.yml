---
- name: Add host aliases
  lineinfile:
    path: '/etc/hosts'
    line: "{{ item.ip }} {{ item.name }}"
    state: present
  loop: "{{ hosts_entries }}"

- name: Add user and set password
  user:
    name: '{{ username }}'
    password: '{{ password | password_hash(''sha512'') }}'
    shell: '/bin/bash'
    groups: sudo
    append: yes

- name: Install packages
  apt:
    name: "{{ packages_to_install }}"
    state: present
    update_cache: yes

# ── Company data (created before wiper runs) ──────────────────────────────────

- name: Create company data directory tree
  file:
    path: "{{ company_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"
  loop:
    - hr
    - finance
    - engineering
    - admin
    - contracts

- name: Populate company data files
  copy:
    dest: "{{ company_data_dir }}/{{ item.path }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
