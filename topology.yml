name: hackingteam

hosts:
  - name: spy-server
    base_box:
      image: ubuntu-noble-x86_64
      man_user: ubuntu
    flavor: standard.small

  - name: victim
    base_box:
      image: ubuntu-noble-x86_64
      man_user: ubuntu
    flavor: standard.small

  - name: colleague
    base_box:
      image: ubuntu-noble-x86_64
      man_user: ubuntu
    flavor: standard.small

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: standard.small

networks:
  - name: spyware-switch
    cidr: 192.168.100.0/24
    accessible_by_user: True

net_mappings:
  - host: spy-server
    network: spyware-switch
    ip: 192.168.100.5

  - host: victim
    network: spyware-switch
    ip: 192.168.100.10

  - host: colleague
    network: spyware-switch
    ip: 192.168.100.20

router_mappings:
  - router: router
    network: spyware-switch
    ip: 192.168.100.1

groups: []
