name: coinminer

hosts:
  - name: pool-server
    base_box:
      image: ubuntu-noble-x86_64
      man_user: ubuntu
    flavor: standard.small

  - name: miner-host
    base_box:
      image: ubuntu-noble-x86_64
      man_user: ubuntu
    flavor: standard.small

  - name: second-host
    base_box:
      image: ubuntu-noble-x86_64
      man_user: ubuntu
    flavor: standard.small

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: standard.small

networks:
  - name: pool-switch
    cidr: 192.168.40.0/24
    accessible_by_user: False

  - name: victim-switch
    cidr: 192.168.50.0/24

net_mappings:
  - host: pool-server
    network: pool-switch
    ip: 192.168.40.5

  - host: miner-host
    network: victim-switch
    ip: 192.168.50.5

  - host: second-host
    network: victim-switch
    ip: 192.168.50.6

router_mappings:
  - router: router
    network: pool-switch
    ip: 192.168.40.1
  - router: router
    network: victim-switch
    ip: 192.168.50.1

groups: []
